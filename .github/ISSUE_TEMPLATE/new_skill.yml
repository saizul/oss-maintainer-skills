name: New skill proposal
description: Propose (or offer to write) a new skill for open-source maintainers
labels: ["new skill", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        See "Write a new skill" in CONTRIBUTING.md and start from `templates/skill/SKILL.md`.
  - type: input
    id: name
    attributes:
      label: Skill name
      description: lowercase-with-hyphens, at most 64 characters
      placeholder: "funding-setup"
    validations:
      required: true
  - type: textarea
    id: when
    attributes:
      label: When should an agent use it?
      description: Example requests a maintainer would type.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow outline
      description: The steps, decision points and what the user gets at the end.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: Helper script (optional)
      description: A deterministic check or generator that would make the skill more reliable.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to write this skill
